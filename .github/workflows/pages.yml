name: Publicar Balatro Advisor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Comprobar tipos y pruebas
        run: npm run check
      - name: Construir la web
        run: npm run build:site
      - name: Instalar Chrome para la prueba estática
        run: npx --no-install playwright install --with-deps chrome
      - name: Comprobar registro desde la tienda
        run: node tools/shop-session-test.mjs
      - name: Comprobar compras registradas de vales
        run: node tools/voucher-shop-test.mjs
      - name: Comprobar sobres y elecciones observadas
        run: node tools/pack-shop-test.mjs
      - name: Comprobar consejo de opciones visibles de sobres
        run: node tools/pack-choices-test.mjs
      - name: Comprobar Tarot dirigidos y mano observada
        run: node tools/tarot-test.mjs
      - name: Comprobar Arcana y uso directo sobre la mano observada
        run: node tools/arcana-test.mjs
      - name: Comprobar comparación de objetivos de Arcana
        run: node tools/arcana-choices-test.mjs
      - name: Comprobar Tarot de dinero y dependencias de datos
        run: node tools/tarot-money-test.mjs
      - name: Comprobar migración recuperable de partidas
        run: node tools/run-migration-test.mjs
      - name: Comprobar recorrido observado de partida
        run: node tools/run-progress-test.mjs
      - name: Comprobar etiquetas y saltos observados
        run: node tools/tags-test.mjs
      - name: Comprobar comparación condicional jugar o saltar
        run: node tools/blind-decision-test.mjs
      - name: Comprobar datos observados por dependencia
        run: node tools/observations-test.mjs
      - name: Comprobar cambios observados por carta y consumible
        run: node tools/inventory-changes-test.mjs
      - name: Comprobar correcciones de comodines y manos
        run: node tools/observed-details-test.mjs
      - name: Comprobar capacidades y decisiones independientes
        run: node tools/decision-test.mjs
      - name: Comprobar consecuencias y planes en tienda
        run: node tools/consequences-test.mjs
      - name: Comprobar la web bajo una subruta
        run: node tools/static-site-test.mjs
      - name: Preparar el artefacto público
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar el artefacto comprobado
        id: deployment
        uses: actions/deploy-pages@v4
