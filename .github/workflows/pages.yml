name: Publicar Balatro Advisor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Comprobar tipos y pruebas
        run: npm run check
      - name: Construir la web
        run: npm run build:site
      - name: Instalar Chrome para la prueba estática
        run: npx --no-install playwright install --with-deps chrome
      - name: Comprobar registro desde la tienda
        run: node tools/shop-session-test.mjs
      - name: Comprobar la web bajo una subruta
        run: node tools/static-site-test.mjs
      - name: Preparar el artefacto público
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar el artefacto comprobado
        id: deployment
        uses: actions/deploy-pages@v4
